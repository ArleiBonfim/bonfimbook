name: CI

# Dispara em pushes e pull requests. A CI compila e testa o CadernoCore num Mac na nuvem
# do GitHub — você não precisa de Mac nem de terminal para ver o resultado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # PORTÃO DE QUALIDADE (bloqueia): compila e testa a biblioteca pura.
  # Se este job ficar vermelho, algo no código do Core quebrou.
  # ---------------------------------------------------------------------------
  test:
    runs-on: macos-14
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # AJUSTE PROVÁVEL NA 1ª RODADA: o nome exato do Xcode instalado no runner muda com
      # o tempo. Em macos-14 costuma haver 15.x e 16.x. Se este passo falhar com
      # "No such file or directory", troque para uma versão que exista no runner
      # (ex.: /Applications/Xcode_16.1.app). Para listar o que há disponível, adicione
      # temporariamente um passo: `ls /Applications | grep Xcode`.
      - name: Selecionar o Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Mostrar versão do Swift (diagnóstico)
        run: swift --version

      # Roda na RAIZ do repo, usando o Package.swift SÓ-CI (biblioteca + testes).
      # Este é o único passo que faz a CI passar ou falhar.
      - name: Rodar os testes do CadernoCore
        run: swift test

  # ---------------------------------------------------------------------------
  # SMOKE TEST (não bloqueia): tenta "construir" o manifesto do app .swiftpm.
  # continue-on-error: true => mesmo que falhe, a CI continua verde no portão principal.
  # É best-effort porque o AppleProductTypes/.iOSApplication depende do toolchain de App
  # e pode não construir por linha de comando em todo runner.
  # ---------------------------------------------------------------------------
  smoke-app:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # Mesmo AJUSTE PROVÁVEL do job de cima: confira o rótulo de versão do Xcode.
      - name: Selecionar o Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      # AJUSTE PROVÁVEL NA 1ª RODADA:
      #  - `-scheme BonfimBook`: o Xcode gera um scheme com o mesmo nome do produto
      #    .iOSApplication ("BonfimBook"). Se o build reclamar de scheme inexistente, rode
      #    `xcodebuild -list` dentro da pasta para ver o nome real e ajuste aqui.
      #  - Pode falhar por causa do AppleProductTypes — é esperado; por isso é best-effort.
      - name: Smoke test do manifesto de App (best-effort)
        working-directory: BonfimBook.swiftpm
        run: |
          xcodebuild \
            -scheme BonfimBook \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
